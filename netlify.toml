[build]
  # Le prerender a besoin d'un Chromium récent : puppeteer 1.20 en embarque un
  # (~2019) où le bundle React moderne ne s'exécute pas (d'où un #root vide).
  # On installe un Chrome stable via @puppeteer/browsers (mis en cache dans
  # ~/.cache/puppeteer par Netlify) et on pointe PUPPETEER_EXECUTABLE_PATH
  # dessus. Si l'installation échoue, le plugin prerender avale l'erreur et le
  # build continue (#root vide = état sans pré-rendu, inoffensif).
  command = "npx --yes @puppeteer/browsers install chrome@stable --path \"$HOME/.cache/puppeteer\" >/dev/null 2>&1 || true; export PUPPETEER_EXECUTABLE_PATH=$(find \"$HOME/.cache/puppeteer\" -type f -name chrome 2>/dev/null | head -1); echo \"[prerender] Chrome: ${PUPPETEER_EXECUTABLE_PATH:-aucun}\"; PRERENDER=1 yarn run build"
  publish = "dist"
  base = "/"
  
[build.environment]
# Allow Netlify's secrets scanner to omit these Vite keys when they are set as environment
# variables (the values should not be checked into the repository). This avoids failing
# builds when the secret values are injected at build time.
  SECRETS_SCAN_OMIT_KEYS = "VITE_UMAMI_SCRIPT_URL,VITE_UMAMI_WEBSITE_ID"
  
# Canonical domain: force portfolio.maelg.com -> cv.maelg.com (avoids duplicate content)
[[redirects]]
  force = true
  from = "https://portfolio.maelg.com/*"
  to = "https://cv.maelg.com/:splat"
  status = 301

[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "https://tryhackme.com/api/v2/public-profile?username=GoGoGadg3t"

[[redirects]]
  force = true
  from = "/certificates/*"
  status = 200
  to = "https://tryhackme.com/api/v2/certificates/public-list?page=1&limit=10&sort=Newest&username=GoGoGadg3t"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://stats.maelg.com https://cdn.jsdelivr.net; connect-src 'self' https://api.github.com https://tryhackme.com https://stats.maelg.com https://bff.ecoindex.fr; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Opener-Policy = "same-origin"

# Assets hashés par Vite : cache long pour accélérer les visites répétées.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images : cache d'un jour (pas de hash dans le nom de fichier).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Le HTML de départ doit toujours être revalidé (routing SPA + meta SEO).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"