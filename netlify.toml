[build]
  command = "PRERENDER=1 yarn run build"
  publish = "dist"
  base = "/"
  
[build.environment]
# Allow Netlify's secrets scanner to omit these Vite keys when they are set as environment
# variables (the values should not be checked into the repository). This avoids failing
# builds when the secret values are injected at build time.
  SECRETS_SCAN_OMIT_KEYS = "VITE_UMAMI_SCRIPT_URL,VITE_UMAMI_WEBSITE_ID"
  
# Canonical domain: force portfolio.maelg.com -> cv.maelg.com (avoids duplicate content)
[[redirects]]
  force = true
  from = "https://portfolio.maelg.com/*"
  to = "https://cv.maelg.com/:splat"
  status = 301

[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "https://tryhackme.com/api/v2/public-profile?username=GoGoGadg3t"

[[redirects]]
  force = true
  from = "/certificates/*"
  status = 200
  to = "https://tryhackme.com/api/v2/certificates/public-list?page=1&limit=10&sort=Newest&username=GoGoGadg3t"

[[_headers]]
  for = "/*"
  [[_headers.values]]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://stats.maelg.com; connect-src 'self' https://api.github.com https://tryhackme.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"