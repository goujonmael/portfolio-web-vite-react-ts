  <style>
    @keyframes blurIn {
      from {
        filter: blur(0px);
      }

      to {
        filter: blur(50px);
      }
    }

    @keyframes movePath {
      0% {
        transform: scaleY(1.4);
      }

      100% {
        transform: scaleY(1);
      }
    }

    #root::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url(/anneau.svg);
      background-position: center;
      background-size: 100% 100%;
      filter: blur(0);
      animation: blurIn 4s forwards, movePath 6s forwards;
      z-index: -1;
    }
  </style>

<body style="background-color: #0d1117; color: #c9d1d9; font-family: 'Lato', sans-serif;">
  <div id="error" style="display: none; color: red; text-align: center; margin-top: 20px;">
    <h1>Erreur de chargement de l'application</h1>
    <p>Veuillez vérifier votre console pour plus de détails.</p>
  </div>

  <div id="root"></div>

  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      const errorDiv = document.getElementById('error');
      if (loader) loader.style.display = 'none';
      if (document.querySelector('#root')) {
        errorDiv.style.display = 'none';
      } else {
        errorDiv.style.display = 'block';
        console.error('Élément racine non trouvé. Échec du chargement de l\'application.');
      }
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
