<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Turret+Road:wght@200;300;400;500;700;800&display=swap"
    as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Turret+Road:wght@200;300;400;500;700;800&display=swap">
  </noscript>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio GOUJON Mael</title>
  <meta name="description" content="Étudiant en Informatique. Alternant chez Airbus. Passionné par la cybersécurité et le développement logiciel.">
  <meta name="keywords" content="portfolio, GOUJON Mael, cybersecurity, software development">
  <meta name="author" content="GOUJON Mael">
  <meta property="og:title" content="Portfolio GOUJON Mael">
  <meta property="og:description" content="Portfolio of GOUJON Mael, showcasing projects and skills.">
  <link rel="stylesheet" href="/src/styles.css">
  
  <style>
    @keyframes blurIn {
      from {
        filter: blur(0px);
      }
      to {
        filter: blur(50px);
      }
    }

    @keyframes movePath {
      0% {
        transform: scaleY(1.4);
      }
      100% {
        transform: scaleY(1);
      }
    }

    #root::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url(/anneau.svg);
      background-position: center;
      background-size: 100% 100%;
      filter: blur(0);
      animation: blurIn 4s forwards, movePath 6s forwards;
      z-index: -1;
    }
  </style>
</head>

<body style="background-color: #0d1117; color: #c9d1d9; font-family: 'Lato', sans-serif;">
  <div id="error" style="display: none; color: red; text-align: center; margin-top: 20px;">
    <h1>Error loading the application</h1>
    <p>Please check your console for more details.</p>
  </div>
  
  <div id="root"></div>
  
  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('loader');
      const errorDiv = document.getElementById('error');
      if (loader) loader.style.display = 'none';
      if (document.querySelector('#root')) {
        errorDiv.style.display = 'none';
      } else {
        errorDiv.style.display = 'block';
        console.error('Root element not found. Application failed to load.');
      }
    });
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
