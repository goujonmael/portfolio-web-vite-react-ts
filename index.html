<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Connexions établies en amont pour réduire la latence des ressources tierces
       (polices, statistiques, badge ecoindex). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://stats.maelg.com">
  <link rel="preconnect" href="https://bff.ecoindex.fr">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <!-- Polices Google Fonts chargées de façon non bloquante.
       media="print" => la feuille de style ne bloque pas le premier rendu,
       puis /js/load-fonts.js la bascule en "all". Seules les graisses réellement
       utilisées sont demandées (au lieu de 16 variantes). -->
  <link id="font-css" rel="stylesheet" media="print" fetchpriority="high"
    href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Turret+Road:wght@500;800&display=swap">
  <script defer src="/js/load-fonts.js"></script>
  <noscript>
    <!-- Repli si JavaScript désactivé : feuille de style classique. -->
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Turret+Road:wght@500;800&display=swap">
  </noscript>

  <!-- Préchargement de l'image du profil : c'est l'élément LCP.
       Rendue côté client par React, elle doit être détectable dès le HTML initial
       et prioritaire (fetchpriority=high) pour réduire le délai de chargement.
       On précharge la variante AVIF (préférée par <picture>) avec le même
       srcset/sizes que la balise image, pour que le navigateur précharge
       exactement la candidate qu'il affichera (la 350 sur mobile) et non une
       taille/format qui serait gaspillée. -->
  <link rel="preload" as="image" type="image/avif" fetchpriority="high"
    imagesrcset="/images/Me/me_square_350.avif 350w, /images/Me/me_square_700.avif 700w"
    imagesizes="(max-width: 600px) 45vw, 350px">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script defer src="https://stats.maelg.com/script.js" data-website-id="4b103e12-20cd-4050-a6a4-65da7943529f"></script>
  <title>Maël Goujon — Portfolio — Full Stack Developer & Cyber Security</title>
  <meta name="description"
    content="Portfolio of Maël Goujon, computer science student and apprentice at Airbus. Passionate about cyber security and software development.">
  <meta name="keywords" content="portfolio, Mael Goujon, cyber security, software development, Airbus, computer science">
  <meta name="author" content="Maël Goujon">
  <meta property="og:title" content="Maël Goujon — Portfolio">
  <meta property="og:description"
    content="Portfolio of Maël Goujon, computer science student and apprentice at Airbus. Passionate about cyber security and software development.">
  <meta property="og:image" content="https://cv.maelg.com/favicon.svg">
  <meta property="og:url" content="https://cv.maelg.com">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Maël Goujon — Portfolio">
  <meta name="twitter:description"
    content="Portfolio of Maël Goujon, computer science student and apprentice at Airbus. Passionate about cyber security and software development.">
  <meta name="twitter:image" content="https://cv.maelg.com/favicon.svg">
  <link rel="canonical" href="https://cv.maelg.com" />

  <style>
    @keyframes blurIn {
      from {
        filter: blur(0px);
      }

      to {
        filter: blur(50px);
      }
    }

    @keyframes movePath {
      0% {
        transform: scaleY(1.4);
      }

      100% {
        transform: scaleY(1);
      }
    }

    #root::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url(/anneau.svg);
      background-position: center;
      background-size: 100% 100%;
      filter: blur(0);
      animation: blurIn 4s forwards, movePath 6s forwards;
      z-index: -1;
    }

    #ecoindex-badge {
      position: fixed;
      bottom: 10px;
      right: 10px;
      z-index: 1000;
      transition: opacity 1s ease;
    }

    #ecoindex-badge-link {
      background-color: #2a2a2a !important;
    }

  </style>
</head>

<body style="background-color: #0d1117; color: #c9d1d9; font-family: 'Lato', 'Lato Fallback', sans-serif;">
  <noscript>
    <div style="color: #ffdfba; text-align: center; margin-top: 20px;">
      <h1>Maël Goujon — Portfolio</h1>
      <p>Loading the portfolio of Maël Goujon — Full Stack Developer and Cyber Security apprentice at Airbus. Find my skills, projects, certificates and CV.</p>
      <p>Main pages: Home, Skills, Education, CyberSecurity, Projects.</p>
    </div>
  </noscript>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <div id="ecoindex-badge" data-theme="dark"></div>
  <script src="https://cdn.jsdelivr.net/gh/cnumr/ecoindex_badge@3/assets/js/ecoindex-badge.js" defer></script>
  <script src="/js/ecoindex-badge.js" defer></script>

</body>

</html>
